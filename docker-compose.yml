services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: wallet_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
    networks:
      - wallet_network

  nginx:
    image: nginx:1.27-alpine
    container_name: wallet_nginx
    restart: unless-stopped
    ports:
      - "18080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - wallet_network

  mysql:
    image: mysql:8.4
    container_name: wallet_mysql
    restart: unless-stopped
    ports:
      - "33060:3306"
    environment:
      MYSQL_DATABASE: wallet_db
      MYSQL_USER: wallet_user
      MYSQL_PASSWORD: wallet_pass
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wallet_network

volumes:
  mysql_data:

networks:
  wallet_network:
    driver: bridge
